<!DOCTYPE html>
<html>
<head>
<title>Global Tech Connect</title>
<script src="script.js"></script>
</head>

<body>

<h2>Event Registration</h2>

<form onsubmit="return registerUser()">

<table>
    <tr>   
    <td>Full name: </td>
    <td>
        <input type="text" id="name">
      <p id="nameError" style="color:red"></p> 
    </td>

    </tr>
    <br><br>
    <tr>
        <td>Professional Email: </td>
        <td>
            <input type="text" id="email">
            <p id="emailError" style="color: red;"></p>
        </td>
    </tr>
    <br><br>

    <tr>
        <td>Company / institution: </td>
        <td>
            <input type="text" id="company">
        </td>
    </tr>
<br><br>
    <tr>
        <td>Attendance Type: </td>
        <td>
            <input type="radio" name="type" value="Virtual"> Virtual
            <input type="radio" name="type" value="In-Person">In-Person 
            <p id="typeError" style="color:red"></p>

        </td>
    </tr>
   
</table>

<br>

<button type="submit">Register</button>

</form>

<br><br>

<button onclick="toggleAnalytics()" id="analyticsBtn">
Show Event Analytics
</button>

<div id="analyticsPanel" style="display:none">

<h3>Event Statistics</h3>

Total Registrants: <span id="total"></span><br>
Virtual: <span id="virtualCount"></span><br>
In-Person: <span id="personCount"></span>

</div>

</body>
</html>
